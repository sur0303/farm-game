syntax = "proto3";

package farmtcaplus;

option go_package = "farmgame/api/gen/farmtcaplus;farmtcapluspb";

import "tcapluspb/options.proto";
import "player/player.proto";
import "farm/farm.proto";
import "friend/friend.proto";
import "workflow/workflow.proto";

// These messages freeze the Redis -> Tcaplus migration shape. They are not
// active runtime tables yet. Tcaplus RecordVersion remains the optimistic
// record version; writer_epoch is the Actor-holder fence.
message PlayerRecordTable {
  option (tcaplusservice.tcaplus_primary_key) = "player_id";
  uint64 player_id = 1;
  uint64 writer_epoch = 2;
  player.PlayerRecord record = 3;
}

message FarmRecordTable {
  option (tcaplusservice.tcaplus_primary_key) = "farm_id";
  uint64 farm_id = 1;
  uint64 writer_epoch = 2;
  farm.FarmRecord record = 3;
}

message WorkflowRecordTable {
  option (tcaplusservice.tcaplus_primary_key) = "workflow_id";
  option (tcaplusservice.tcaplus_index) = "due_workflow(next_retry_at_ms,state)";
  string workflow_id = 1;
  int64 next_retry_at_ms = 2;
  workflow.WorkflowState state = 3;
  workflow.WorkflowRecord record = 4;
}

message FriendRelationTable {
  option (tcaplusservice.tcaplus_primary_key) = "player_low_id,player_high_id";
  option (tcaplusservice.tcaplus_index) = "low_roster(player_low_id,status)";
  option (tcaplusservice.tcaplus_index) = "high_roster(player_high_id,status)";
  uint64 player_low_id = 1;
  uint64 player_high_id = 2;
  friend.RelationStatus status = 3;
  friend.FriendRelation relation = 4;
}

message FriendMutationReceiptTable {
  option (tcaplusservice.tcaplus_primary_key) = "operation_id";
  string operation_id = 1;
  friend.FriendMutationReceipt receipt = 2;
}
