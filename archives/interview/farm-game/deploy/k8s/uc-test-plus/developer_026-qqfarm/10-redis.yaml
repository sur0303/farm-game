apiVersion: v1
kind: Service
metadata:
  name: farm-redis-headless
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-redis
    app.kubernetes.io/part-of: farm-game
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: farm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: cluster-bus
      port: 16379
      targetPort: cluster-bus
---
apiVersion: v1
kind: Service
metadata:
  name: farm-redis
  namespace: developer_026-qqfarm
  labels:
    app: farm-redis
    app.kubernetes.io/name: farm-redis
    app.kubernetes.io/part-of: farm-game
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: farm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: farm-redis
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-redis
    farm.io/redis-topology: cluster-3m3s
spec:
  serviceName: farm-redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: farm-redis
  template:
    metadata:
      labels:
        app: farm-redis
        app.kubernetes.io/name: farm-redis
        farm.io/redis-topology: cluster-3m3s
    spec:
      priorityClassName: high-cpu-priority
      terminationGracePeriodSeconds: 20
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec redis-server \
                --bind 0.0.0.0 \
                --port 6379 \
                --protected-mode no \
                --save "" \
                --appendonly no \
                --maxmemory 6gb \
                --maxmemory-policy noeviction \
                --cluster-enabled yes \
                --cluster-config-file /data/nodes.conf \
                --cluster-node-timeout 5000 \
                --cluster-announce-ip "$POD_IP" \
                --cluster-announce-port 6379 \
                --cluster-announce-bus-port 16379
          ports:
            - name: redis
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 8Gi
