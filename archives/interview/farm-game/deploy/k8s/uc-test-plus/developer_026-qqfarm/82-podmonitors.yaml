apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: farm-gate
  namespace: developer_026-qqfarm
  labels:
    release: po
    app.kubernetes.io/name: farm-gate
    app.kubernetes.io/part-of: farm-game
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: farm-gate
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 5s
  podTargetLabels:
    - app.kubernetes.io/name
    - app.kubernetes.io/component
---
