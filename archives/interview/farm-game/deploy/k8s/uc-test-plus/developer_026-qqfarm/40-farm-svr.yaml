apiVersion: v1
kind: Service
metadata:
  name: farm-svr
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-svr
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: farm-svr
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: health
      port: 9091
      targetPort: health
    - name: holder-mtls
      port: 19101
      targetPort: holder-mtls
---
apiVersion: v1
kind: Service
metadata:
  name: farm-svr-headless
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-svr
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: farm-svr
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: holder-mtls
      port: 19101
      targetPort: holder-mtls
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: farm-svr
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-svr
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
spec:
  serviceName: farm-svr-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: farm-svr
  template:
    metadata:
      labels:
        app: farm-svr
        app.kubernetes.io/name: farm-svr
        app.kubernetes.io/component: farm-holder
        app.kubernetes.io/part-of: farm-game
        farm.io/redis-client: "true"
      annotations:
        farm.io/activation-status: DYNAMIC_REMOTE_WATCH_4X4X4
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: high-cpu-priority
      serviceAccountName: farm-holder
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: uc-registry
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h farm-redis ping | grep -q PONG; do sleep 1; done"]
        - name: dynamic-route-controller-barrier
          image: mirrors.tencent.com/uc-backend/farm-route-runtime@sha256:7cce9e1b9ed27c8318180b1b14afb18130cb54035fbae9b77a8edd8f683fde6e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=0
              until nslookup player-svr-0.player-svr-headless.developer_026-qqfarm.svc.cluster.local >/dev/null 2>&1 \
                && nslookup player-svr-1.player-svr-headless.developer_026-qqfarm.svc.cluster.local >/dev/null 2>&1 \
                && nslookup farm-svr-0.farm-svr-headless.developer_026-qqfarm.svc.cluster.local >/dev/null 2>&1 \
                && nslookup farm-svr-1.farm-svr-headless.developer_026-qqfarm.svc.cluster.local >/dev/null 2>&1; do
                attempt=$((attempt+1)); [ "$attempt" -lt 180 ] || exit 70; sleep 1
              done
              attempt=0
              until wget -q -T 2 -O /dev/null http://route-controller.developer_026-qqfarm.svc.cluster.local:8081/readyz 2>/dev/null; do
                attempt=$((attempt+1)); [ "$attempt" -lt 180 ] || exit 71; sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: farm-svr
          image: mirrors.tencent.com/uc-backend/farm-route-runtime@sha256:7cce9e1b9ed27c8318180b1b14afb18130cb54035fbae9b77a8edd8f683fde6e
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: farm-platform
          env:
            - name: FARM_SERVICE
              value: farm-svr
            - name: FARM_LISTEN
              value: ":9090"
            - name: FARM_HEALTH_LISTEN
              value: ":9091"
            # Keep pprof available for post-load diagnosis; enabled before
            # Holder creation by the 1024 reset script.
            - name: HOLDER_PPROF_ENABLED
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: ACTOR_HOLDER_IDENTITY_MODE
              value: kubernetes-process-v1
            - name: ACTOR_HOLDER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # The clean-bootstrap workflow replaces this with the live
            # StatefulSet UID while replicas are still zero.
            - name: ACTOR_HOLDER_WORKLOAD_UID
              value: PENDING_STAGED_APPLY
            - name: ACTOR_HOLDER_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: ACTOR_HOLDER_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOLDER_PROCESS_BOOT_MODE
              value: pod-uid-then-random
            - name: HOLDER_PROCESS_BOOT_DIR
              value: /var/run/farm-holder
            - name: FARM_LOGIC_ENDPOINT
              value: $(POD_NAME).farm-svr-headless.developer_026-qqfarm.svc.cluster.local:9090
            - name: FARM_HOLDER_ENDPOINT
              value: $(POD_NAME).farm-svr-headless.developer_026-qqfarm.svc.cluster.local:19101
            - name: FARM_HOLDER_TLS_DNS_IDENTITY
              value: holder-control.developer_026-qqfarm.svc.cluster.local
            - name: FARM_HOLDER_CONTROL_LISTEN
              value: ":19101"
            - name: FARM_HOLDER_TLS_CERT_FILE
              value: /etc/farm/route-control/holder-server.crt
            - name: FARM_HOLDER_TLS_KEY_FILE
              value: /etc/farm/route-control/holder-server.key
            - name: FARM_HOLDER_CLIENT_CA_FILE
              value: /etc/farm/route-control/ca.crt
            - name: HOLDER_CONTROL_CONTROLLER_IDENTITY
              value: route-controller.developer_026-qqfarm.svc.cluster.local
            - name: HOLDER_WORKLOAD_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/farm/holder-control/token
            - name: FARM_OPPORTUNITY_WAKEUP_ATTACH_ENABLED
              value: "true"
            - name: FARM_OPPORTUNITY_HEADER_READ_MODE
              value: narrow
            - name: FARM_OPPORTUNITY_HEADER_MODE_FILE
              value: /etc/farm/opportunity-mode/header-read-mode
            - name: FARM_OPPORTUNITY_HEADER_MODE_POLL_INTERVAL
              value: 1s
            - name: DOWNLINK_BATCH_SIZE
              value: "32"
            - name: DOWNLINK_LANE_WORKERS
              value: "4"
            - name: FARM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: redis-url
            - name: FARM_AUTHORITY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: authority-redis-url
            - name: FARM_RUNTIME_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: runtime-redis-url
            - name: FARM_PROJECTION_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: projection-redis-url
            - name: FARM_REDIS_CLUSTER
              value: "1"
            - name: FARM_REDIS_CLUSTER_URLS
              valueFrom:
                configMapKeyRef:
                  name: farm-platform
                  key: FARM_REDIS_CLUSTER_URLS
            - name: PERMIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: permit-secret
            # Commit proofs default OFF. The process generates its own
            # holder/boot Ed25519 key; never mount private signing material.
            - name: THEFT_PRF_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: theft-prf-hmac-secret
          ports:
            - name: grpc
              containerPort: 9090
            - name: health
              containerPort: 9091
            - name: holder-mtls
              containerPort: 19101
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: route-control-tls
              mountPath: /etc/farm/route-control
              readOnly: true
            - name: holder-process-boot
              mountPath: /var/run/farm-holder
            - name: holder-control-token
              mountPath: /var/run/secrets/farm/holder-control
              readOnly: true
            - name: farm-opportunity-mode
              mountPath: /etc/farm/opportunity-mode
              readOnly: true
      volumes:
        - name: route-control-tls
          secret:
            secretName: farm-route-dynamic-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: route-client.crt
                path: route-client.crt
              - key: route-client.key
                path: route-client.key
              - key: holder-server.crt
                path: holder-server.crt
              - key: holder-server.key
                path: holder-server.key
        - name: holder-process-boot
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: holder-control-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: classic-farm-holder-control
                  expirationSeconds: 600
                  path: token
        - name: farm-opportunity-mode
          configMap:
            name: farm-opportunity-mode
            items:
              - key: header-read-mode
                path: header-read-mode
              - key: hint-transport
                path: hint-transport
              - key: stage
                path: stage
