apiVersion: v1
kind: ServiceAccount
metadata:
  name: farm-prometheus
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: farm-prometheus
  namespace: developer_026-qqfarm
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: farm-prometheus
  namespace: developer_026-qqfarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: farm-prometheus
subjects:
  - kind: ServiceAccount
    name: farm-prometheus
    namespace: developer_026-qqfarm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: farm-prometheus-config
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-prometheus
    app.kubernetes.io/part-of: farm-game
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s
      external_labels:
        cluster: uc-test-plus
        namespace: developer_026-qqfarm
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: farm-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [developer_026-qqfarm]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: farm-grafana-datasources
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-grafana
    app.kubernetes.io/part-of: farm-game
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://farm-prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: Service
metadata:
  name: farm-prometheus
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-prometheus
    app.kubernetes.io/part-of: farm-game
spec:
  type: NodePort
  selector:
    app: farm-prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
      nodePort: 31890
---
apiVersion: v1
kind: Service
metadata:
  name: farm-grafana
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-grafana
    app.kubernetes.io/part-of: farm-game
spec:
  type: NodePort
  selector:
    app: farm-grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
      nodePort: 31830
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farm-prometheus
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-prometheus
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farm-prometheus
  template:
    metadata:
      labels:
        app: farm-prometheus
        app.kubernetes.io/name: farm-prometheus
        app.kubernetes.io/part-of: farm-game
    spec:
      serviceAccountName: farm-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: farm-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farm-grafana
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-grafana
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farm-grafana
  template:
    metadata:
      labels:
        app: farm-grafana
        app.kubernetes.io/name: farm-grafana
        app.kubernetes.io/part-of: farm-game
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: farm-grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: farm-grafana-dashboard-provisioning
        - name: dashboards
          configMap:
            name: farm-grafana-command-dashboard
        - name: data
          emptyDir: {}
