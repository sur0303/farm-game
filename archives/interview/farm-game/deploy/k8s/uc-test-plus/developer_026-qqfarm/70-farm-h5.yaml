apiVersion: v1
kind: ConfigMap
metadata:
  name: farm-h5-nginx
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-h5
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      location = /healthz { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
      location = /readyz { access_log off; return 200 'ready\n'; add_header Content-Type text/plain; }
      location /ws {
        proxy_pass http://farm-gate:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
      }
      location /api/ {
        proxy_pass http://farm-gate:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /v1/ {
        proxy_pass http://farm-gate:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: farm-h5
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-h5
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: farm-h5
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31881
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farm-h5
  namespace: developer_026-qqfarm
  labels:
    app.kubernetes.io/name: farm-h5
    app.kubernetes.io/part-of: farm-game
    uc.qq.com/owner: developer_026
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: farm-h5
  template:
    metadata:
      labels:
        app: farm-h5
        app.kubernetes.io/name: farm-h5
        app.kubernetes.io/component: h5-nginx
        app.kubernetes.io/part-of: farm-game
    spec:
      imagePullSecrets:
        - name: uc-registry
      containers:
        - name: nginx
          image: mirrors.tencent.com/uc-backend/farm-h5@sha256:339915c40055a120f7018b88eeab5436fafbf126aa20fa90ab79fbbd6139d735
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: farm-h5-nginx
