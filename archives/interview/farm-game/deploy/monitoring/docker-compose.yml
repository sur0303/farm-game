# Prometheus + Grafana 监控栈
# 用法: cd deploy/monitoring && docker compose up -d
#
# 访问:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (admin/admin)
#
# 默认抓取 deploy/docker-compose.local.yml 的 host-network 端口。
# farm-gate 需要以 GATE_WS_METRICS=1 启动，/metrics 端点才会暴露。

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: farm-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: farm-grafana
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # 默认数据源指向 Prometheus
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
