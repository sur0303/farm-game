apiVersion: v1
kind: Namespace
metadata:
  name: farm-l2-r2-deps
  labels:
    app.kubernetes.io/part-of: farm-game
    farm.io/lab-id: farm-l2-r2
    farm.io/dependency-profile: local-dedicated
---
apiVersion: v1
kind: Service
metadata:
  name: farm-local-redis-headless
  namespace: farm-l2-r2-deps
  labels:
    app.kubernetes.io/name: farm-local-redis
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: farm-local-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: cluster-bus
      port: 16379
      targetPort: cluster-bus
---
apiVersion: v1
kind: Service
metadata:
  name: farm-local-redis
  namespace: farm-l2-r2-deps
  labels:
    app.kubernetes.io/name: farm-local-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: farm-local-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: farm-local-redis
  namespace: farm-l2-r2-deps
  labels:
    app.kubernetes.io/name: farm-local-redis
    farm.io/capacity-role: dependency-not-measured-target
    farm.io/redis-topology: cluster-3m3s
spec:
  serviceName: farm-local-redis-headless
  replicas: 6
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: farm-local-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: farm-local-redis
        farm.io/capacity-role: dependency-not-measured-target
        farm.io/redis-topology: cluster-3m3s
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec redis-server \
                --bind 0.0.0.0 \
                --port 6379 \
                --protected-mode no \
                --save "" \
                --appendonly no \
                --maxmemory 768mb \
                --maxmemory-policy noeviction \
                --cluster-enabled yes \
                --cluster-config-file /data/nodes.conf \
                --cluster-node-timeout 5000 \
                --cluster-announce-ip "$POD_IP" \
                --cluster-announce-port 6379 \
                --cluster-announce-bus-port 16379
          ports:
            - name: redis
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: farm-local-redis-default-deny
  namespace: farm-l2-r2-deps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: farm-local-redis
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              farm.io/lab-id: farm-l2-r2
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: farm-local-redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: farm-local-redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
