# Grafana Dashboard 自动加载配置
apiVersion: 1

providers:
  - name: 'farm-gate'
    orgId: 1
    folder: 'Farm Game'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
