// ── 27~28. 经济(28 §6.1;RouteKey 只来自 TrustedCommandContext.session.player_id,
// Payload 不重复携带操作者 ID,L2-PROTO-39)──
// 32 §2.2:Payload 只携带 ID、数量和期望版本,单价与总价一律由服务端
// ShopOffer(offer_id, offer_version) 决定。expected_offer_version 与权威不一致
// 时成交被拒(32 §2.3),旧价格页面必须先刷新。
message BuyRequest {
  int32 offer_id = 1;
  int32 count = 2;
  uint64 expected_offer_version = 3;
}

// BuyResult/SellResult 沿用现行已接线的最小经济结果形状(私有状态 + 变动
// 摘要);字段细化与最小化由第 32 号合同后续冻结,演进只能追加。
// 服务端实际编码的是 player.EconomyCommandResult,客户端按 BuyResult 解码:
// 两者字段号必须逐个对齐,新增字段要同时加到两边(见 TestBuyResultStaysWireCompatibleWithEconomyCommandResult)。
message BuyResult {
  player.PrivateState private_state = 1;
  int64 coin_delta = 2;
  int32 item_id = 3;
  int64 item_delta = 4;
  // 32 §2.2:成交按哪个版本的报价结算,客户端据此判断本地价目表是否过期。
  uint64 offer_version = 5;
  int64 unit_price = 6;
}

message SellRequest {
  int32 item_id = 1;
  int64 count = 2;
}

message SellResult {
  player.PrivateState private_state = 1;
  int64 coin_delta = 2;
  int32 item_id = 3;
  int64 item_delta = 4;
}

// ── 29. UNLOCK_PLOT(28 §5.2A)──
// 等级、价格、货币类型与前置 Plot 由服务端版本化 PlotUnlockRule 冻结,
// 客户端只提交 plot_id 与页面看到的规则版本。
message UnlockPlotRequest {
  uint64 target_farm_id = 1;
  uint32 plot_id = 2;
  uint64 expected_plot_version = 3;
  uint64 expected_unlock_rule_version = 4;
}

message UnlockPlotResult {
  uint64 farm_id = 1;
  uint32 plot_id = 2;
  uint64 applied_unlock_rule_version = 3;
  uint64 paid_normal_coin = 4;
  uint64 normal_coin_balance = 5;
  uint64 committed_plot_version = 6;
  uint64 committed_farm_version = 7;
}

// ── 30. PLANT(28 §5.2)──
// seed_item_id、成熟时间、产量与护理/偷菜数值是服务器字段,不进入客户端
// Payload,也不进入 Canonical Payload Hash。
//
// 字段号纪律(P1B 冻结):plot_id/crop_definition_id 沿用旧内部
// PlantCropRequest 的 1/2 号布局,新增字段只追加;这使尚未重接线的
// FirstHop 按旧消息解码时读到相同语义值(兼容窗口,见 handoff ICR)。
message PlantRequest {
  uint32 plot_id = 1;
  uint32 crop_definition_id = 2;
  uint64 target_farm_id = 3;
  uint64 expected_plot_version = 4;
  uint64 expected_crop_rule_version = 5;
}

// 普通农场 CommandResult 只返回最小业务结果与 committed version
// (28 §2.2 约束 7,L2-PROTO-31)。
message PlantResult {
  uint64 target_farm_id = 1;
  uint32 plot_id = 2;
  string crop_cycle_id = 3;
  uint64 committed_farm_version = 4;
}

// ── 31. HARVEST(28 §5.3)──
// plot_id 沿用旧 HarvestCropRequest 的 1 号布局(兼容窗口,同 PlantRequest)。
message HarvestRequest {
  uint32 plot_id = 1;
  uint64 target_farm_id = 2;
  string crop_cycle_id = 3;
  uint64 expected_plot_version = 4;
}

// compendium_newly_unlocked 仅表示本次 Harvest 的 PlayerActor 提交首次解锁
// 该植物;同一 operation 重试必须返回同一解锁结果(L2-PROTO-61)。
message HarvestResult {
  uint64 target_farm_id = 1;
  uint32 plot_id = 2;
  string crop_cycle_id = 3;
  uint64 committed_farm_version = 4;
  uint32 harvested_quantity = 5;
  bool compendium_newly_unlocked = 6;
  optional uint32 unlocked_crop_definition_id = 7;
  uint64 compendium_revision = 8;
}

// ── 32. CARE(28 §5.4)──
enum CareType {
  CARE_TYPE_UNSPECIFIED = 0;
  CARE_TYPE_WATER = 1;
  CARE_TYPE_PEST = 2; // 虫害 Incident 由第 32 号合同冻结
}

// CareOutcome 是公网稳定护理结果类(32 §5.4)。
enum CareOutcome {
  CARE_OUTCOME_UNSPECIFIED = 0;
  CARE_OUTCOME_RESOLVED = 1;
  CARE_OUTCOME_ALREADY_RESOLVED = 2;
}

// plot_id 沿用旧 WaterCropRequest 的 1 号布局(兼容窗口,同 PlantRequest);
// WATER 与 REMOVE_PEST(公网兼容拼写 CARE_TYPE_PEST)均已进入 Authority Care 路径。
message CareRequest {
  uint32 plot_id = 1;
  uint64 target_farm_id = 2;
  string crop_cycle_id = 3;
  string incident_id = 4;
  CareType care_type = 5;
}

// CareResult 是 catalog 声明的公网结果类型(28/32 §5.4)。字段 1~4 保持兼容;
// 5 起补齐冻结稳定结果,不含可变投递状态。
message CareResult {
  uint64 target_farm_id = 1;
  uint32 plot_id = 2;
  string crop_cycle_id = 3;
  uint64 committed_farm_version = 4;
  string incident_id = 5;
  CareType care_type = 6;
  CareOutcome outcome = 7;
  uint64 resolved_by_player_id = 8;
  uint64 committed_plot_version = 9;
  string care_reward_order_id = 10;
  bool reward_obligation_created = 11;
}

// ── 33. THEFT(28 §5.5)──
// plot_id 沿用旧 BeginTheftRequest 的 1 号布局(兼容窗口,同 PlantRequest)。
message TheftRequest {
  uint32 plot_id = 1;
  uint64 target_farm_id = 2;
  string crop_cycle_id = 3;
}

message TheftResult {
  uint64 target_farm_id = 1;
  uint32 plot_id = 2;
  string crop_cycle_id = 3;
  uint64 committed_farm_version = 4;
  string settlement_id = 5;
}
