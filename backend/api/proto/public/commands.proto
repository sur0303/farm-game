message GetMailDetailRequest {
  string mail_id = 1;
}

message GetMailDetailResult {
  reserved 1 to 50;
  MailDetailView mail = 51;
  MailboxSummaryView summary = 52;
  int64 trusted_server_now_ms = 53;
}

message MarkMailReadRequest {
  string mail_id = 1;
}

message MarkMailReadResult {
  reserved 1 to 50;
  string mail_id = 51;
  MailboxSummaryView summary = 52;
