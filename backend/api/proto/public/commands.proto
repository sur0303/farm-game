// ── 18~19. 图鉴(28 §5.9;GetCompendiumResult 字段 TODO(37))──
message GetCompendiumRequest {
  optional string archive_cursor = 1;
}

message GetCompendiumResult {
  reserved 1 to 60;
  CompendiumPageView page = 61;
}

enum CompendiumDisplayState {
