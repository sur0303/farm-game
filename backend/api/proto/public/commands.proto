syntax = "proto3";

package public;

option go_package = "farmgame/api/gen/public;publicpb";

import "common/enums.proto";
import "common/envelope.proto";
import "economy/economy.proto";
import "player/player.proto";

// ============================================================================
// 公开命令 Typed Payload / Result(28 §5/§6.1,P1B 唯一 field number 闸门)
//
// 本文件是 33 类公开命令业务 Payload 与 Result 的唯一登记处。Payload 只包含
// 目标与业务参数:操作者 player_id、Session Fence、Subscription、Permit、
// Actor Route、WriterEpoch、Redis Key、VirtualShard 与 writer claim 一律不
// 进入公网 Payload(28 §0.5/§0.6,L2-PROTO-05/06)。
//
// 标注 "TODO(32~37)" 的 Result 是合同占位:对应业务字段由第 32~37 号场景
// 合同唯一拥有,在业务 Handler 接线前不允许伪造字段;占位消息只保留
// reserved 段。已按 28 冻结形状的消息(§3.7/§3.8/§5)不允许再改语义,
// 演进只能追加字段或 reserved。
// ============================================================================

// ── 1. JOIN_FARM(28 §5.1)──
// join_attempt_id 不进入客户端 Payload,由 Gate 在 ADMITTED 前生成。
message JoinFarmRequest {
  uint64 target_farm_id = 1;
}
// JOIN_FARM 无 Result Payload:元信息只经 common.JoinResultContext 携带
// (28 §6.1,L2-PROTO-27)。

// ── 2. GET_PLAYER_BOOTSTRAP(28 §3.7,L2-PROTO-62)──
message GetPlayerBootstrapRequest {
}

message PlayerPrivateProfileView {
  uint64 player_id = 1;
  string display_name = 2;
}

message PlayerProgressionView {
  int32 level = 1;
  int64 exp = 2;
}

message WalletView {
  int64 coin = 1;
}

message InventoryView {
  repeated economy.ItemStack items = 1;
}

// PlayerFeatureSummaryView 是支持系统摘要(任务/邮件/图鉴红点等)的占位;
// 具体摘要字段由第 34/35/37 号合同冻结。
message PlayerFeatureSummaryView {
  reserved 1 to 30;
  PlayerTaskSummaryView tasks = 31;
  MailboxSummaryView mail = 32;
  CompendiumSummaryView compendium = 33;
  PetSummaryView pet = 34;
}

message MailboxSummaryView {
  uint64 mailbox_revision = 1;
  int64 unread_count = 2;
  int64 claimable_attachment_count = 3;
  bool has_red_point = 4;
}

message CompendiumSummaryView {
  uint64 compendium_revision = 1;
  uint64 compendium_seen_revision = 2;
  bool has_new_unlock = 3;
  uint32 unlocked_count = 4;
}

message PetSummaryView {
  uint64 pet_state_version = 1;
  optional uint32 active_guard_pet_id = 2;
  int64 guard_until_ms = 3;
  bool guard_effective = 4;
}

enum PlayerTaskProgressState {
  PLAYER_TASK_PROGRESS_STATE_UNSPECIFIED = 0;
  PLAYER_TASK_PROGRESS_ACTIVE = 1;
  PLAYER_TASK_PROGRESS_CLAIMABLE = 2;
  PLAYER_TASK_PROGRESS_CLAIMED = 3;
}

message PlayerTaskProgressView {
  string instance_id = 1;
  string task_id = 2;
  int64 progress = 3;
  int64 target = 4;
  PlayerTaskProgressState state = 5;
}

message PlayerTaskSummaryView {
  uint64 task_state_version = 1;
  int32 claimable_count = 2;
  string daily_period_id = 3;
  repeated PlayerTaskProgressView daily_tasks = 4;
  optional PlayerTaskProgressView current_growth = 5;
}

// Bootstrap 只包含玩家私有资料、经济、库存、成长与支持系统摘要;不得携带
// FarmSnapshot/Plot/Crop/FarmVersion(28 §3.7 约束 3)。
message GetPlayerBootstrapResult {
  uint64 player_state_revision = 1;
  PlayerPrivateProfileView profile = 2;
  PlayerProgressionView progression = 3;
  WalletView wallet = 4;
  InventoryView inventory = 5;
  PlayerFeatureSummaryView feature_summary = 6;
  int64 trusted_server_now_ms = 7;
}

// ── 3. GET_FRIEND_LIST(28 §6.1;33 §6;SCB-HERO-SOCIAL-READ)──
message GetFriendListRequest {
  // Opaque server cursor bound to viewer and roster revision. Empty starts a
  // new page scan; H5 never parses or constructs it.
  string cursor = 1;
  uint32 page_size = 2;
}

message PublicProfileView {
  uint64 player_id = 1;
  string display_name = 2;
  uint32 avatar_id = 3;
  uint32 level = 4;
}

// Values 1/2/4 match Farm Authority Facts evaluation. CAN_VISIT is the
// canonical Pair validation result; no bit is an execution permit.
enum FriendActionMaskBit {
  FRIEND_ACTION_MASK_BIT_UNSPECIFIED = 0;
  FRIEND_ACTION_MASK_CAN_THEFT = 1;
  FRIEND_ACTION_MASK_CAN_WATER = 2;
  FRIEND_ACTION_MASK_CAN_PEST = 4;
  FRIEND_ACTION_MASK_CAN_VISIT = 8;
}

enum FriendOpportunityReadStatus {
  FRIEND_OPPORTUNITY_READ_STATUS_UNSPECIFIED = 0;
  FRIEND_OPPORTUNITY_READY = 1;
  FRIEND_OPPORTUNITY_UNKNOWN = 2;
}

message FriendEntryView {
  PublicProfileView public_profile = 1;
  reserved 2 to 20; // frozen historical ownership; append only after 20
  string relation_id = 21;
  uint64 relation_epoch = 22;
  uint32 action_mask = 23;
  uint64 opportunity_revision = 24;
  FriendOpportunityReadStatus opportunity_status = 25;
  int64 validated_at_ms = 26;
}

message GetFriendListResult {
  reserved 1 to 50; // frozen historical ownership; append only after 50
  repeated FriendEntryView friends = 51;
  string next_cursor = 52;
  uint64 roster_revision = 53;
  int64 validated_at_ms = 54;
}

// ── 4. GET_NEXT_FRIEND_OPPORTUNITY(28 §3.7,L2-PROTO-63)──
message FriendOpportunityHintedTarget {
  uint64 owner_id = 1;
  uint64 opportunity_revision = 2;
}

message GetNextFriendOpportunityRequest {
  repeated FriendOpportunityHintedTarget hinted_targets = 1;
}

enum FriendOpportunityLookupStatus {
  FRIEND_OPPORTUNITY_LOOKUP_STATUS_UNSPECIFIED = 0;
  FRIEND_OPPORTUNITY_FOUND = 1;
  FRIEND_OPPORTUNITY_NONE = 2;
}

message FriendOpportunityCandidateView {
  uint64 target_farm_id = 1;
  PublicProfileView public_profile = 2;
  uint32 action_mask = 3;
  uint64 opportunity_revision = 4;
  int64 validated_at_ms = 5;
  string relation_id = 6;
  uint64 relation_epoch = 7;
  FriendOpportunityReadStatus opportunity_status = 8;
}

// FOUND 必须携带 candidate;NONE 必须是明确无机会;依赖失败固定返回
// REJECTED + FRIEND_OPPORTUNITY_TEMPORARILY_UNAVAILABLE,不得伪装成 NONE。
message GetNextFriendOpportunityResult {
  FriendOpportunityLookupStatus lookup_status = 1;
  optional FriendOpportunityCandidateView candidate = 2;
  string navigation_generation = 3;
}

// ── 5. GET_OPERATION_RESULT(28 §3.8,L2-PROTO-17/18/25/46/54)──
message OperationTargetLocator {
  oneof target {
    uint64 target_farm_id = 1;
    uint64 peer_player_id = 2;
    string mail_id = 3;
  }
}

message GetOperationResultRequest {
  common.CommandType original_command_type = 1;
  string original_operation_id = 2;
  OperationTargetLocator original_target = 3;
  optional string server_operation_locator = 4;
}

enum OperationLookupStatus {
  OPERATION_LOOKUP_STATUS_UNSPECIFIED = 0;
  OPERATION_LOOKUP_NOT_FOUND = 1;
  OPERATION_LOOKUP_PROCESSING = 2;
  OPERATION_LOOKUP_COMPLETED = 3;
  OPERATION_LOOKUP_EXPIRED = 4;
}

// StoredFarmOutcomeContext 只保存业务目标 target_farm_id;request_id、
// subscription_id、join_attempt_id、Session Fence 与临时 RetryDirective
// 不进入长期 OperationResult(L2-PROTO-25)。
message StoredFarmOutcomeContext {
  uint64 target_farm_id = 1;
}

// StoredOperationOutcome 是不含网络请求身份和临时重试指令的原业务结果;
// status 只能是终态 SUCCEEDED / REJECTED / NO_CHANGE。
message StoredOperationOutcome {
  common.CommandType original_command_type = 1;
  string original_operation_id = 2;
  common.CommandStatus status = 3;
  common.ErrorDetail error = 4;
  optional StoredFarmOutcomeContext farm_context = 5;
  bytes result_payload = 6;
}

// completed_retry_directive 由服务端按 original_command_type + 终态
// ErrorCode + ErrorRecoveryPolicy 在查询时重建(L2-PROTO-46)。
message GetOperationResultResult {
  common.CommandType original_command_type = 1;
  string original_operation_id = 2;
  OperationLookupStatus lookup_status = 3;
  optional StoredOperationOutcome completed_outcome = 4;
  uint32 retry_after_ms = 5;
  common.RetryDirective completed_retry_directive = 6;
}

