message DeleteMailRequest {
  string mail_id = 1;
}

message DeleteMailResult {
  reserved 1 to 50;
  string mail_id = 51;
  MailboxSummaryView summary = 52;
}

// Claim Payload 只含 mail_id:不得携带 operation_id、RewardBundle、
