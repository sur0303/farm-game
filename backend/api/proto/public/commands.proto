// Ack 只携带客户端已应用的 observed_revision,按
// max(current_seen, min(observed, current_revision)) 单调推进(L2-PROTO-60)。
message AckCompendiumSeenRequest {
  uint64 observed_revision = 1;
}

message AckCompendiumSeenResult {
  uint64 compendium_seen_revision_after = 1;
  uint64 current_compendium_revision = 2;
}

// ── 20~23. 分享与加好友(28 §5.7/§6.1;Result 字段 TODO(33))──
// inviter 只能来自当前 Session,Payload 不携带 inviter_player_id。
message GenerateShareTokenRequest {
}

// 普通轮换不携带 peer;删除/拉黑后重新加好友必须显式携带
// reactivation_peer_player_id(L2-PROTO-56)。pair_id、barrier_revision、
// generation floor 与 RotateReceipt 均为服务端受信字段,不进入 Payload。
message RotateShareTokenRequest {
  optional uint64 reactivation_peer_player_id = 1;
}

message RevokeShareTokenRequest {
}

message ShareTokenResult {
  reserved 1 to 50; // TODO(33)
}

// 原始 ShareToken 是 Bearer 凭证:H5 在收到携带 Locator 的 ACCEPTED/PROCESSING
// 后保存 Locator 并立即清除原始 Token(28 §3.8 约束 11)。
message RedeemShareRequest {
  string opaque_share_token = 1;
}

message RedeemShareResult {
  reserved 1 to 50; // TODO(33)
}

